name: 每天自动更新日期

on:
  schedule:
    # 每天 UTC 时间 00:10 运行（北京时间早上 08:10）
    - cron: '10 0 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新日期为今天
        id: update
        run: |
          # ========== 请修改这里为你的实际文件名 ==========
          FILE="README.md"
          # ===============================================

          # 生成今天的中文日期，例如：2026年09月17日
          TODAY=$(date +'%Y年%m月%d日')
          
          echo "今天日期：$TODAY"

          # 检查文件是否存在
          if [ ! -f "$FILE" ]; then
            echo "错误：找不到文件 $FILE"
            exit 1
          fi

          # 替换日期行（匹配「XXXX年XX月XX日更新」格式）
          # 使用临时文件保证兼容性
          sed -i "s/[0-9]\{4\}年[0-9]\{2\}月[0-9]\{2\}日更新/${TODAY}更新/g" "$FILE"

          # 检查是否有修改
          if git diff --quiet "$FILE"; then
            echo "日期已经是最新的，无需提交"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "日期已更新为 $TODAY"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_date=$TODAY" >> $GITHUB_OUTPUT
          fi

      - name: 提交并推送更改
        if: steps.update.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          git commit -m "chore: 自动更新测评日期为 ${{ steps.update.outputs.new_date }}"
          git push
